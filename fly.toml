# fly.toml — Fly.io deployment config for AI Execution System
app = "smart-todo-forge"
primary_region = "sin"   # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILE = "default"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false   # ← keeps app alive 24/7 (never sleeps)
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
