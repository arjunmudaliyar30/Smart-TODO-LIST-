# =============================================================================
#  AI Execution System — PRODUCTION Profile
#  Activated with: -Dspring.profiles.active=prod
#  All values MUST come from environment variables in production.
#  Nothing is hardcoded here intentionally.
# =============================================================================

# ---------------------------------------------------------------------------
# Server — serve behind a reverse proxy (nginx / AWS ALB)
# ---------------------------------------------------------------------------
server.port=${APP_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %t "%r" %s %b %D ms

# ---------------------------------------------------------------------------
# MongoDB — Atlas or production replica set URI required
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# JWT — must provide strong secret in env
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:2592000000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION_MS:7776000000}

# ---------------------------------------------------------------------------
# OpenAI
# ---------------------------------------------------------------------------
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o}

# ---------------------------------------------------------------------------
# Twilio
# ---------------------------------------------------------------------------
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM}
twilio.retry.max-attempts=${TWILIO_RETRY_MAX_ATTEMPTS:3}

# ---------------------------------------------------------------------------
# CORS — must be set to actual production domain
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# ---------------------------------------------------------------------------
# File Upload
# ---------------------------------------------------------------------------
file.upload.dir=${FILE_UPLOAD_DIR:/app/uploads/}
file.allowed-types=image/jpeg,image/png,image/gif,image/webp,application/pdf
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------------------------------------------------------------------------
# AI Rate Limiting
# ---------------------------------------------------------------------------
ai.rate-limit.requests-per-minute=${AI_RATE_LIMIT_PER_MINUTE:20}

# ---------------------------------------------------------------------------
# Logging — JSON-friendly structured format for log aggregators (Datadog, etc.)
# ---------------------------------------------------------------------------
logging.level.com.yourapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework=WARN
logging.pattern.console={"time":"%d{yyyy-MM-dd'T'HH:mm:ss.SSS}","level":"%-5level","user":"%X{userId}","logger":"%logger{36}","msg":"%msg"}%n
