# =============================================================================
#  AI Execution System — Base Configuration
#  All secrets are read from environment variables.
#  Set the following env vars before running:
#    APP_PORT, MONGODB_URI, JWT_SECRET, JWT_EXPIRATION_MS,
#    OPENAI_API_KEY, OPENAI_MODEL,
#    TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_FROM,
#    ALLOWED_ORIGINS, FILE_UPLOAD_DIR, AI_RATE_LIMIT_PER_MINUTE
# =============================================================================

# Active profile (override with -Dspring.profiles.active=prod)
spring.profiles.active=${SPRING_PROFILE:default}

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:${APP_PORT:8080}}
spring.application.name=ai-execution-system

# ---------------------------------------------------------------------------
# MongoDB
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# 512-bit Base64-encoded HMAC-SHA256 key — override with JWT_SECRET env var in production
jwt.secret=${JWT_SECRET}
# 30 days in ms — configurable via env
jwt.expiration=${JWT_EXPIRATION_MS:2592000000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION_MS:7776000000}

# ---------------------------------------------------------------------------
# Groq AI (OpenAI-compatible API)
# ---------------------------------------------------------------------------
openai.api.key=${GROQ_API_KEY}
openai.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
openai.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# ---------------------------------------------------------------------------
# Twilio (WhatsApp)
# ---------------------------------------------------------------------------
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
twilio.retry.max-attempts=${TWILIO_RETRY_MAX_ATTEMPTS:3}

# ---------------------------------------------------------------------------
# Email (SMTP) — override with env vars in production
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500}

# ---------------------------------------------------------------------------
# File Upload — only images and PDF allowed
# ---------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}
file.upload.dir=${FILE_UPLOAD_DIR:uploads/}
file.allowed-types=${FILE_ALLOWED_TYPES:image/jpeg,image/png,image/gif,image/webp,application/pdf}

# ---------------------------------------------------------------------------
# Web Push (VAPID) — leave blank to auto-generate keys on first run
# Copy the logged keys into these properties for persistence across restarts
# ---------------------------------------------------------------------------
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT}

# ---------------------------------------------------------------------------
# AI Rate Limiting
# ---------------------------------------------------------------------------
ai.rate-limit.requests-per-minute=${AI_RATE_LIMIT_PER_MINUTE:20}

# ---------------------------------------------------------------------------
# Logging (structured for production)
# ---------------------------------------------------------------------------
logging.level.com.yourapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] %logger{36} - %msg%n
